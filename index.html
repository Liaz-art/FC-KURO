
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0c15">
<title>YoruAnime — Catalogue</title>
<style>
:root{
  --bg:#090b14;--panel:#151928;--panel2:#1c2233;
  --line:#2b3247;--txt:#f6f6fb;--muted:#a0abc2;
  --purple:#a78bfa;--pink:#f472b6
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#0b0d18ef;backdrop-filter:blur(15px);border-bottom:1px solid var(--line)}
.nav{max-width:1300px;margin:auto;display:flex;align-items:center;gap:25px;padding:17px 24px}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px;white-space:nowrap}
.logo span{color:var(--purple)}
.navlinks{display:flex;gap:8px}
.navlinks button,.ghost{border:0;background:transparent;color:#c9cce0;padding:9px 12px;border-radius:9px}
.navlinks button.active,.navlinks button:hover,.ghost:hover{background:#27223c;color:white}
.searchbar{margin-left:auto;display:flex;min-width:180px;width:min(370px,100%)}
input,select{background:#1b2031;color:white;border:1px solid #343b50;border-radius:11px;padding:12px 14px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--purple)}
main{max-width:1300px;margin:auto;padding:25px 24px 65px}
.hero{border-radius:20px;padding:40px;min-height:245px;background:radial-gradient(circle at 82% 30%,#7c3aed77,transparent 40%),linear-gradient(110deg,#1b1739,#13192d 75%);border:1px solid #393056;display:flex;align-items:center;justify-content:space-between;gap:20px}
.eyebrow{color:#d4baff;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:clamp(28px,4vw,50px);line-height:1.1;margin:9px 0}
.hero p{color:#c1c3d5;max-width:590px}
.hero .art{font-size:100px;filter:drop-shadow(0 15px 20px #0007)}
.cta,.primary{border:0;background:linear-gradient(100deg,#8b5cf6,#c084fc);color:white;border-radius:11px;padding:12px 18px;font-weight:800}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin:32px 0 18px}
.toolbar h2{margin:0;font-size:25px}
.sub{color:var(--muted);margin:3px 0 0}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select{width:auto;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.anime{border:1px solid #252b3e;border-radius:13px;overflow:hidden;background:var(--panel);position:relative;transition:transform .15s,border-color .15s}
.anime:hover{transform:translateY(-4px);border-color:#7c5fc1}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:linear-gradient(130deg,#29214d,#202d45)}
.cardbody{padding:11px}
.cardtitle{font-weight:750;line-height:1.35;min-height:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.cardhit{position:absolute;inset:0;border:0;background:transparent;width:100%;height:100%;cursor:pointer}
.fav{position:absolute;right:8px;top:8px;z-index:2;border:1px solid #ffffff44;background:#121426db;color:#fff;border-radius:9px;padding:6px 9px;font-size:19px}
.fav.saved{color:#ff80ad}
.pages{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:28px}
.pages button{background:var(--panel2);color:white;border:1px solid var(--line);padding:10px 16px;border-radius:9px}
.pages button:disabled{opacity:.35;cursor:not-allowed}
.notice{padding:28px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--muted)}
.notice button{margin-top:10px}
.modalwrap{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#171b2a;border:1px solid #41465b;border-radius:19px;max-width:780px;width:100%;max-height:90vh;overflow:auto;padding:24px}
.modalhead{display:flex;gap:23px}
.modalhead img{width:190px;max-width:38%;object-fit:cover;align-self:flex-start;border-radius:10px}
.modal h2{margin:0 0 10px;font-size:27px}
.modal p{color:#c6cbd9}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.tag{background:#302844;color:#e0caff;padding:5px 10px;border-radius:20px;font-size:12px}
.close{float:right;border:0;background:#2b3042;color:white;border-radius:8px;padding:6px 11px;margin-bottom:12px}
.muted{color:var(--muted)}
footer{color:var(--muted);text-align:center;border-top:1px solid var(--line);padding:22px}
a{color:#c4adff}
.hide{display:none!important}
@media(max-width:1050px){
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.navlinks{display:none}
}
@media(max-width:650px){
.nav{flex-wrap:wrap;gap:9px;padding:12px 15px}
.searchbar{order:3;width:100%;margin:0}
.hero{padding:25px;min-height:200px}
.hero .art{display:none}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.cardbody{padding:9px}
main{padding:18px 14px 40px}
.modalhead{flex-direction:column}
.modalhead img{width:145px;max-width:100%}
.modal{padding:17px}
}
</style>
</head>
<body>
<header>
<div class="nav">
<div class="logo">Yoru<span>Anime</span></div>
<nav class="navlinks">
<button id="nav-pop" class="active">Populaires</button>
<button id="nav-air">En diffusion</button>
<button id="nav-fav">Mes favoris</button>
</nav>
<div class="searchbar">
<input id="search" type="search" autocomplete="off" placeholder="🔎 Rechercher un animé…" aria-label="Rechercher un animé">
</div>
</div>
</header>

<main>
<section class="hero">
<div>
<div class="eyebrow">✦ Ton univers anime</div>
<h1>Des milliers d'animés.<br>Un seul catalogue.</h1>
<p>Explore les séries, découvre les nouveautés et garde tes favoris à portée de main.</p>
<button class="cta" id="discover">Explorer le catalogue →</button>
</div>
<div class="art" aria-hidden="true">🌙</div>
</section>

<div class="toolbar" id="catalogue">
<div>
<h2 id="heading">Animés populaires</h2>
<p class="sub" id="status" aria-live="polite">Chargement du catalogue…</p>
</div>
<div class="filters">
<select id="genre" aria-label="Genre">
<option value="">Tous les genres</option>
<option value="1">Action</option>
<option value="2">Aventure</option>
<option value="4">Comédie</option>
<option value="8">Drame</option>
<option value="10">Fantasy</option>
<option value="22">Romance</option>
<option value="24">Science-fiction</option>
<option value="36">Tranche de vie</option>
<option value="37">Surnaturel</option>
<option value="14">Horreur</option>
</select>
<select id="sort" aria-label="Trier">
<option value="popularity">Popularité</option>
<option value="score">Meilleures notes</option>
<option value="start_date">Plus récents</option>
</select>
</div>
</div>
<div id="results" class="grid"></div>
<div id="message" class="notice hide"></div>
<div class="pages" id="pages">
<button id="prev">← Précédent</button>
<span id="pagenum">Page 1</span>
<button id="next">Suivant →</button>
</div>
</main>

<footer>
YoruAnime • Catalogue informatif via
<a href="https://jikan.moe/" target="_blank" rel="noopener">Jikan</a>
et
<a href="https://anilist.co" target="_blank" rel="noopener">AniList</a>
• Aucune vidéo hébergée
</footer>

<div id="overlay" class="modalwrap hide" role="dialog" aria-modal="true" aria-label="Fiche animé">
<div class="modal">
<button class="close" id="close">✕ Fermer</button>
<div id="detail"></div>
</div>
</div>

<script>
(()=>{
'use strict';

const API='https://api.jikan.moe/v4';
const el=id=>document.getElementById(id);

const state={
 mode:'pop',
 page:1,
 hasNext:false,
 query:'',
 genre:'',
 sort:'popularity',
 items:[],
 request:0,
 source:'jikan'
};

const cache=new Map();
let favorites={};

try{
 favorites=JSON.parse(localStorage.getItem('yoru_favorites_v2')||'{}')||{};
}catch{}

const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({
 '&':'&amp;',
 '<':'&lt;',
 '>':'&gt;',
 '"':'&quot;',
 "'":'&#39;'
}[c]));

const image=a=>
 a?.images?.webp?.large_image_url||
 a?.images?.jpg?.large_image_url||
 a?.images?.jpg?.image_url||'';

const title=a=>a.title_english||a.title||a.title_japanese||'Sans titre';
const key=a=>String(a.mal_id||'anilist-'+a.anilist_id);

function save(){
 try{
  localStorage.setItem('yoru_favorites_v2',JSON.stringify(favorites));
 }catch{}
}

function toggle(a){
 if(favorites[key(a)]){
  delete favorites[key(a)];
 }else{
  favorites[key(a)]={
   mal_id:a.mal_id,
   anilist_id:a.anilist_id,
   title:a.title,
   title_english:a.title_english,
   images:a.images,
   score:a.score,
   year:a.year,
   type:a.type,
   synopsis:a.synopsis
  };
 }
 save();
 render();
}

async function get(url){
 if(cache.has(url))return cache.get(url);

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),8500);
 let r;

 try{
  r=await fetch(url,{signal:controller.signal});
 }finally{
  clearTimeout(timer);
 }

 if(!r.ok){
  throw Error(
   r.status===429
   ?'Trop de requêtes : patiente quelques secondes.'
   :'Erreur API ('+r.status+').'
  );
 }

 const j=await r.json();
 cache.set(url,j);
 return j;
}

function showMessage(s,retry=false){
 el('message').classList.remove('hide');
 el('message').innerHTML=
  '<div>'+safe(s)+'</div>'+
  (retry?'<button class="primary" id="retry">Réessayer</button>':'');
 if(retry)el('retry').onclick=load;
}

function render(){
 const items=state.mode==='fav'?Object.values(favorites):state.items;
 el('results').innerHTML='';
 el('message').classList.add('hide');

 el('status').textContent=state.mode==='fav'
  ?items.length+' animé(s) sauvegardé(s)'
  :items.length+' résultats sur cette page';

 el('pages').classList.toggle('hide',state.mode==='fav');
 el('pagenum').textContent='Page '+state.page;
 el('prev').disabled=state.page===1;
 el('next').disabled=!state.hasNext;

 if(!items.length){
  showMessage(
   state.mode==='fav'
   ?'Aucun favori pour le moment. Clique sur ♡ pour en ajouter.'
   :'Aucun animé trouvé. Essaie une autre recherche.'
  );
  return;
 }

 for(const a of items){
  const card=document.createElement('article');
  card.className='anime';

  card.innerHTML=
   '<img class="poster" loading="lazy" alt="" src="'+safe(image(a))+'">'+
   '<div class="cardbody">'+
   '<div class="cardtitle">'+safe(title(a))+'</div>'+
   '<div class="meta">'+safe(a.type||'Anime')+
   ' · ⭐ '+safe(a.score||'—')+
   ' · '+safe(a.year||'—')+'</div></div>'+
   '<button class="cardhit" aria-label="Voir '+safe(title(a))+'"></button>'+
   '<button class="fav '+(favorites[key(a)]?'saved':'')+
   '" aria-label="Ajouter ou retirer des favoris">'+
   (favorites[key(a)]?'♥':'♡')+'</button>';

  card.querySelector('.cardhit').onclick=()=>details(a);
  card.querySelector('.fav').onclick=()=>toggle(a);
  el('results').appendChild(card);
 }
}

const genreNames={
 '1':'Action',
 '2':'Adventure',
 '4':'Comedy',
 '8':'Drama',
 '10':'Fantasy',
 '22':'Romance',
 '24':'Sci-Fi',
 '36':'Slice of Life',
 '37':'Supernatural',
 '14':'Horror'
};

const gql=`
query(
 $page:Int,
 $search:String,
 $genre:String,
 $sort:[MediaSort],
 $status:MediaStatus
){
 Page(page:$page,perPage:24){
  pageInfo{hasNextPage}
  media(
   type:ANIME,
   isAdult:false,
   search:$search,
   genre:$genre,
   sort:$sort,
   status:$status
  ){
   id
   idMal
   title{romaji english native}
   coverImage{extraLarge large}
   averageScore
   popularity
   seasonYear
   format
   episodes
   status
   description(asHtml:false)
   genres
   siteUrl
  }
 }
}`;

function convertAni(m){
 return {
  mal_id:m.idMal||null,
  anilist_id:m.id,
  title:m.title?.romaji||m.title?.english,
  title_english:m.title?.english,
  images:{
   webp:{
    large_image_url:m.coverImage?.extraLarge||m.coverImage?.large
   }
  },
  score:m.averageScore?m.averageScore/10:null,
  year:m.seasonYear,
  type:m.format,
  episodes:m.episodes,
  status:m.status,
  synopsis:(m.description||'').replace(/<[^>]*>/g,''),
  genres:(m.genres||[]).map(name=>({name})),
  url:m.siteUrl
 };
}

async function getAniList(){
 const vars={
  page:state.page,
  search:state.query||undefined,
  genre:genreNames[state.genre],
  sort:[
   state.sort==='score'
    ?'SCORE_DESC'
    :state.sort==='start_date'
    ?'START_DATE_DESC'
    :'POPULARITY_DESC'
  ],
  status:state.mode==='air'?'RELEASING':undefined
 };

 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),12000);

 try{
  const r=await fetch('https://graphql.anilist.co',{
   method:'POST',
   headers:{
    'Content-Type':'application/json',
    'Accept':'application/json'
   },
   body:JSON.stringify({query:gql,variables:vars}),
   signal:controller.signal
  });

  if(!r.ok)throw Error('AniList HTTP '+r.status);

  const j=await r.json();
  if(j.errors?.length)throw Error(j.errors[0].message);

  return {
   data:(j.data?.Page?.media||[]).map(convertAni),
   pagination:{
    has_next_page:!!j.data?.Page?.pageInfo?.hasNextPage
   }
  };
 }finally{
  clearTimeout(timer);
 }
}

async function load(){
 const req=++state.request;
 el('results').innerHTML='';
 el('message').classList.add('hide');
 el('status').textContent='Chargement…';

 if(state.mode==='fav'){
  render();
  return;
 }

 let p=new URLSearchParams({
  page:state.page,
  limit:24,
  order_by:state.sort,
  sort:'desc',
  sfw:'true'
 });

 if(state.query)p.set('q',state.query);
 if(state.genre)p.set('genres',state.genre);
 if(state.mode==='air')p.set('status','airing');

 let data;

 try{
  data=await get(API+'/anime?'+p.toString());
  state.source='Jikan';
 }catch(firstError){
  if(req!==state.request)return;

  el('status').textContent='Jikan indisponible, tentative avec AniList…';

  try{
   data=await getAniList();
   state.source='AniList';
  }catch(secondError){
   if(req!==state.request)return;

   el('status').textContent='Impossible de charger le catalogue';

   showMessage(
    'Les deux sources sont inaccessibles. Vérifie ta connexion ou réessaie dans quelques instants. Jikan : '+
    firstError.message+
    ' ; AniList : '+secondError.message,
    true
   );

   el('pages').classList.add('hide');
   return;
  }
 }

 if(req!==state.request)return;

 state.items=data.data||[];
 state.hasNext=!!data.pagination?.has_next_page;
 render();

 el('status').textContent=
  state.items.length+' animés sur cette page · Source : '+state.source;
}

function setMode(mode){
 state.mode=mode;
 state.page=1;
 state.query='';
 el('search').value='';

 ['pop','air','fav'].forEach(m=>
  el('nav-'+m).classList.toggle('active',m===mode)
 );

 el('heading').textContent=
  mode==='fav'?'Mes favoris':
  mode==='air'?'En diffusion':'Animés populaires';

 el('genre').disabled=mode==='fav';
 el('sort').disabled=mode==='fav';
 load();
}

async function details(a){
 el('overlay').classList.remove('hide');
 document.body.style.overflow='hidden';
 el('detail').innerHTML='<div class="notice">Chargement de la fiche…</div>';

 try{
  const d=a.mal_id
   ?((await get(API+'/anime/'+a.mal_id+'/full')).data||a)
   :a;

  const genres=[
   ...(d.genres||[]),
   ...(d.themes||[])
  ].map(g=>
   '<span class="tag">'+safe(g.name)+'</span>'
  ).join('');

  el('detail').innerHTML=
   '<div class="modalhead">'+
   '<img src="'+safe(image(d))+'" alt="Affiche de '+safe(title(d))+'">'+
   '<div><div class="eyebrow">Fiche animé</div>'+
   '<h2>'+safe(title(d))+'</h2>'+
   '<div class="muted">⭐ '+safe(d.score||'—')+
   ' · '+safe(d.type||'—')+
   ' · '+safe(d.episodes||'?')+
   ' épisodes · '+safe(d.status||'')+'</div>'+
   '<div class="tags">'+genres+'</div>'+
   '<button class="primary" id="detailfav">'+
   (favorites[key(d)]?'♥ Retirer des favoris':'♡ Ajouter aux favoris')+
   '</button><p><a href="'+safe(
    d.url||(d.anilist_id
     ?'https://anilist.co/anime/'+d.anilist_id
     :'https://myanimelist.net/anime/'+d.mal_id)
   )+'" target="_blank" rel="noopener">Voir la fiche ↗</a></p>'+
   '</div></div>'+
   '<h3>Synopsis</h3>'+
   '<p>'+safe(d.synopsis||'Synopsis indisponible.')+'</p>'+
   '<p class="muted">Catalogue d’information uniquement : aucun épisode vidéo n’est fourni.</p>';

  el('detailfav').onclick=()=>{
   toggle(d);
   details(d);
  };
 }catch(e){
  el('detail').innerHTML=
   '<h2>'+safe(title(a))+'</h2>'+
   '<p>'+safe(a.synopsis||'Synopsis indisponible.')+'</p>'+
   '<p class="muted">Informations détaillées temporairement indisponibles.</p>';
 }
}

let debounce;

el('search').addEventListener('input',e=>{
 clearTimeout(debounce);
 debounce=setTimeout(()=>{
  state.query=e.target.value.trim();
  state.page=1;
  if(state.mode==='fav')setMode('pop');
  state.query=e.target.value.trim();
  load();
 },450);
});

el('genre').onchange=e=>{
 state.genre=e.target.value;
 state.page=1;
 load();
};

el('sort').onchange=e=>{
 state.sort=e.target.value;
 state.page=1;
 load();
};

el('prev').onclick=()=>{
 if(state.page>1){
  state.page--;
  load();
  el('catalogue').scrollIntoView();
 }
};

el('next').onclick=()=>{
 if(state.hasNext){
  state.page++;
  load();
  el('catalogue').scrollIntoView();
 }
};

el('nav-pop').onclick=()=>setMode('pop');
el('nav-air').onclick=()=>setMode('air');
el('nav-fav').onclick=()=>setMode('fav');

el('discover').onclick=()=>
 el('catalogue').scrollIntoView({behavior:'smooth'});

function close(){
 el('overlay').classList.add('hide');
 document.body.style.overflow='';
}

el('close').onclick=close;
el('overlay').onclick=e=>{
 if(e.target===el('overlay'))close();
};

document.addEventListener('keydown',e=>{
 if(e.key==='Escape')close();
});

load();
})();
</script>
</body>
</html>
