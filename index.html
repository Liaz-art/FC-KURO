
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YoruAnime V2</title>
<style>
:root{--bg:#090b14;--panel:#171b2c;--line:#30364c;--purple:#a78bfa;--muted:#a5acc1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font:15px system-ui,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:#0d0f1ced;border-bottom:1px solid var(--line)}
nav{max-width:1250px;margin:auto;padding:16px;display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:900}
.logo span{color:var(--purple)}
nav button{border:0;border-radius:9px;background:#24233a;color:white;padding:10px}
nav button.active{background:#7049d6}
input,select{background:#1c2133;color:white;border:1px solid #39405a;border-radius:9px;padding:12px}
#search{margin-left:auto;width:min(330px,100%)}
main{max-width:1250px;margin:auto;padding:24px 18px 65px}
.hero{background:radial-gradient(circle at 85% 25%,#6b36b477,transparent 45%),linear-gradient(110deg,#211a43,#15192c);border:1px solid #43365c;border-radius:18px;padding:35px}
.hero h1{font-size:clamp(28px,5vw,48px);margin:0}
.hero p,.muted{color:var(--muted)}
.primary{border:0;background:linear-gradient(100deg,#8855ed,#bd7df5);color:white;padding:11px 17px;border-radius:9px;font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:30px 0 18px}
.toolbar h2{margin:0}
.filters{display:flex;gap:9px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card:hover{border-color:var(--purple);transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block}
.cardbody{padding:11px}
.cardtitle{font-weight:700;min-height:40px;line-height:1.35}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.fav{position:absolute;right:7px;top:7px;background:#111729dd;color:white;border:1px solid #ffffff55;border-radius:8px;padding:5px 10px;font-size:20px}
.fav.saved{color:#ff82ac}
.pages{display:flex;justify-content:center;align-items:center;gap:15px;margin:30px}
.pages button,.episode{background:#252b40;color:white;border:1px solid #414864;border-radius:9px;padding:11px}
.pages button:disabled{opacity:.4}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.overlay{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}
.modal{background:#171b2b;border:1px solid #434960;border-radius:17px;width:100%;max-width:900px;max-height:92vh;overflow:auto;padding:22px}
.close{float:right;background:#30364b;color:white;border:0;border-radius:8px;padding:9px}
.modalhead{display:flex;gap:20px;align-items:flex-start}
.modalhead img{width:165px;max-width:35%;border-radius:10px}
.modal h2{margin-top:0}
.modal p{line-height:1.6;color:#c8cddd}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tag{background:#322746;color:#dfc9ff;border-radius:20px;padding:5px 9px;font-size:12px}
.player{background:#0b0d17;border:1px solid var(--line);border-radius:12px;padding:15px;margin:15px 0}
.player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.episodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px;margin-top:15px}
.episode{text-align:left}
.episode:hover{border-color:var(--purple)}
a{color:#c7b3ff}
footer{text-align:center;padding:22px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){
.grid{grid-template-columns:repeat(2,1fr);gap:10px}
#search{width:100%;margin:0}
.hero{padding:23px}
.modalhead{flex-direction:column}
.modalhead img{max-width:100%;width:140px}
}
</style>
</head>
<body>
<header>
<nav>
<div class="logo">Yoru<span>Anime</span></div>
<button id="popular" class="active">Populaires</button>
<button id="airing">En diffusion</button>
<button id="favorites">Mes favoris</button>
<input id="search" placeholder="🔎 Rechercher un animé...">
</nav>
</header>

<main>
<section class="hero">
<h1>Des milliers d'animés.<br>Un seul catalogue.</h1>
<p>Explore les séries, les nouveautés et tes favoris.</p>
<button class="primary" onclick="document.getElementById('catalogue').scrollIntoView({behavior:'smooth'})">Explorer le catalogue →</button>
</section>

<section id="catalogue">
<div class="toolbar">
<div>
<h2 id="heading">Animés populaires</h2>
<p class="muted" id="status">Chargement...</p>
</div>
<div class="filters">
<select id="genre">
<option value="">Tous les genres</option>
<option>Action</option>
<option>Adventure</option>
<option>Comedy</option>
<option>Drama</option>
<option>Fantasy</option>
<option>Romance</option>
<option>Sci-Fi</option>
<option>Horror</option>
</select>
<select id="sort">
<option value="POPULARITY_DESC">Popularité</option>
<option value="SCORE_DESC">Meilleures notes</option>
<option value="START_DATE_DESC">Plus récents</option>
</select>
</div>
</div>
<div id="results" class="grid"></div>
<div id="message" class="notice hide"></div>
<div id="pages" class="pages">
<button id="prev">← Précédent</button>
<span id="pageLabel">Page 1</span>
<button id="next">Suivant →</button>
</div>
</section>
</main>

<footer>YoruAnime • Données AniList et Jikan • Aucun épisode vidéo hébergé</footer>

<div id="overlay" class="overlay hide">
<div class="modal">
<button class="close" id="close">✕ Fermer</button>
<div id="detail"></div>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const API="https://graphql.anilist.co";
const JIKAN="https://api.jikan.moe/v4";

const state={
 mode:"popular",
 page:1,
 search:"",
 genre:"",
 sort:"POPULARITY_DESC",
 hasNext:false,
 items:[],
 request:0
};

const cache=new Map();
let detailRequest=0;
let controller=null;
let debounce=null;
let favorites={};

try{
 favorites=JSON.parse(localStorage.getItem("yoru_favorites_v2")||"{}");
}catch{
 favorites={};
}

const query=`
query($page:Int,$search:String,$genre:String,$sort:[MediaSort],$status:MediaStatus){
 Page(page:$page,perPage:24){
  pageInfo{hasNextPage}
  media(type:ANIME,isAdult:false,search:$search,genre:$genre,sort:$sort,status:$status){
   id idMal
   title{romaji english native}
   coverImage{extraLarge large}
   averageScore seasonYear format episodes status
   description(asHtml:false)
   genres siteUrl
   trailer{id site}
  }
 }
}`;

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function clean(s){
 return String(s||"").replace(/<[^>]*>/g,"");
}

function name(a){
 return a.title?.english||a.title?.romaji||a.title?.native||"Sans titre";
}

function poster(a){
 return a.coverImage?.extraLarge||a.coverImage?.large||"";
}

function key(a){
 return String(a.id);
}

function save(){
 try{
 localStorage.setItem("yoru_favorites_v2",JSON.stringify(favorites));
 }catch{}
}

function toggle(a){
 if(favorites[key(a)])delete favorites[key(a)];
 else favorites[key(a)]=a;
 save();
 render();
}

async function requestAniList(variables,signal){
 const r=await fetch(API,{
 method:"POST",
 headers:{"Content-Type":"application/json","Accept":"application/json"},
 body:JSON.stringify({query,variables}),
 signal
 });
 if(!r.ok)throw Error("AniList : HTTP "+r.status);
 const json=await r.json();
 if(json.errors?.length)throw Error(json.errors[0].message);
 return json.data.Page;
}

async function requestJikan(){
 const genres={
 Action:1,Adventure:2,Comedy:4,Drama:8,
 Fantasy:10,Romance:22,"Sci-Fi":24,Horror:14
 };
 const params=new URLSearchParams({
 page:state.page,limit:24,sfw:"true",
 order_by:state.sort==="SCORE_DESC"?"score":
 state.sort==="START_DATE_DESC"?"start_date":"popularity",
 sort:"desc"
 });
 if(state.search)params.set("q",state.search);
 if(state.genre)params.set("genres",genres[state.genre]);
 if(state.mode==="airing")params.set("status","airing");

 const r=await fetch(JIKAN+"/anime?"+params);
 if(!r.ok)throw Error("Jikan : HTTP "+r.status);
 const json=await r.json();

 return {
 pageInfo:{hasNextPage:json.pagination?.has_next_page},
 media:(json.data||[]).map(a=>({
 id:"mal-"+a.mal_id,
 idMal:a.mal_id,
 title:{english:a.title_english,romaji:a.title},
 coverImage:{extraLarge:a.images?.webp?.large_image_url||a.images?.jpg?.large_image_url},
 averageScore:a.score?Math.round(a.score*10):null,
 seasonYear:a.year,
 format:a.type,
 episodes:a.episodes,
 status:a.status,
 description:a.synopsis,
 genres:(a.genres||[]).map(g=>g.name),
 siteUrl:a.url
 }))
 };
}

async function load(){
 const id=++state.request;
 if(controller)controller.abort();
 controller=new AbortController();

 if(state.mode==="favorites"){
  render();
  return;
 }

 const cacheKey=JSON.stringify([
 state.mode,state.page,state.search,state.genre,state.sort
 ]);

 $("status").textContent="Recherche en cours...";

 if(cache.has(cacheKey)){
  const data=cache.get(cacheKey);
  state.items=data.media;
  state.hasNext=data.pageInfo.hasNextPage;
  render();
  return;
 }

 const variables={
 page:state.page,
 search:state.search||undefined,
 genre:state.genre||undefined,
 sort:[state.sort],
 status:state.mode==="airing"?"RELEASING":undefined
 };

 try{
  let data;
  let source="AniList";

  try{
   const timeout=setTimeout(()=>controller.abort(),5500);
   try{
    data=await requestAniList(variables,controller.signal);
   }finally{
    clearTimeout(timeout);
   }
  }catch(e){
   if(id!==state.request)return;
   source="Jikan";
   $("status").textContent="Chargement depuis Jikan...";
   data=await requestJikan();
  }

  if(id!==state.request)return;

  state.items=data.media||[];
  state.hasNext=!!data.pageInfo?.hasNextPage;
  cache.set(cacheKey,data);
  if(cache.size>80)cache.delete(cache.keys().next().value);
  render();
  $("status").textContent=state.items.length+" animés · Source : "+source;

 }catch(e){
  if(id!==state.request)return;
  $("status").textContent="Catalogue indisponible";
  $("results").innerHTML="";
  $("message").classList.remove("hide");
  $("message").textContent="Impossible de charger le catalogue. Réessaie dans quelques instants. "+e.message;
  $("pages").classList.add("hide");
 }
}

function render(){
 const items=state.mode==="favorites"?Object.values(favorites):state.items;
 $("results").innerHTML="";
 $("message").classList.toggle("hide",items.length>0);
 $("pages").classList.toggle("hide",state.mode==="favorites");
 $("pageLabel").textContent="Page "+state.page;
 $("prev").disabled=state.page<=1;
 $("next").disabled=!state.hasNext;

 if(!items.length){
  $("message").textContent="Aucun animé trouvé.";
  return;
 }

 for(const a of items){
  const card=document.createElement("article");
  card.className="card";
  card.innerHTML=`
   <img loading="lazy" src="${esc(poster(a))}" alt="">
   <div class="cardbody">
    <div class="cardtitle">${esc(name(a))}</div>
    <div class="meta">${esc(a.format||"Anime")} · ⭐ ${a.averageScore?(a.averageScore/10).toFixed(1):"—"} · ${esc(a.seasonYear||"—")}</div>
   </div>
   <button class="fav ${favorites[key(a)]?"saved":""}">${favorites[key(a)]?"♥":"♡"}</button>
  `;
  card.onclick=()=>details(a);
  card.querySelector(".fav").onclick=e=>{
   e.stopPropagation();
   toggle(a);
  };
  $("results").appendChild(card);
 }
}

function setMode(mode){
 state.mode=mode;
 state.page=1;
 state.search="";
 $("search").value="";
 ["popular","airing","favorites"].forEach(id=>
  $(id).classList.toggle("active",id===mode)
 );
 $("heading").textContent=mode==="favorites"?"Mes favoris":mode==="airing"?"En diffusion":"Animés populaires";
 load();
}

async function details(a){
 const token=++detailRequest;
 $("overlay").classList.remove("hide");
 document.body.style.overflow="hidden";

 const tags=(a.genres||[]).map(g=>`<span class="tag">${esc(g)}</span>`).join("");

 $("detail").innerHTML=`
 <div class="modalhead">
  <img src="${esc(poster(a))}" alt="">
  <div>
   <h2>${esc(name(a))}</h2>
   <p class="muted">⭐ ${a.averageScore?(a.averageScore/10).toFixed(1):"—"} · ${esc(a.format||"Anime")} · ${esc(a.episodes||"?")} épisodes</p>
   <div class="tags">${tags}</div>
   <button id="detailFav" class="primary">${favorites[key(a)]?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}</button>
   <p><a href="${esc(a.siteUrl||"https://anilist.co")}" target="_blank" rel="noopener">Voir la fiche AniList ↗</a></p>
  </div>
 </div>
 <h3>Synopsis</h3>
 <p>${esc(clean(a.description)||"Synopsis indisponible.")}</p>
 <h3>Lecteur</h3>
 <div class="player" id="player"><p class="muted">Recherche d'une bande-annonce disponible...</p></div>
 <h3>Épisodes</h3>
 <p class="muted">Liste informative, sans vidéo complète.</p>
 <div id="episodeStatus" class="muted">Chargement des épisodes...</div>
 <div id="episodes" class="episodes"></div>
 <p><button id="more" class="primary hide">Afficher plus d'épisodes</button></p>
 `;

 $("detailFav").onclick=()=>{
  toggle(a);
  $("detailFav").textContent=favorites[key(a)]?"♥ Retirer des favoris":"♡ Ajouter aux favoris";
 };

 const trailer=a.trailer;
 if(trailer?.site==="youtube"&&/^[a-zA-Z0-9_-]{11}$/.test(trailer.id)){
  $("player").innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${trailer.id}" title="Bande-annonce" allowfullscreen></iframe>`;
 }else{
  $("player").innerHTML='<p class="muted">Aucune bande-annonce disponible pour cet animé.</p>';
 }

 if(!a.idMal){
  $("episodeStatus").textContent="Liste des épisodes indisponible pour cet animé.";
  return;
 }

 let page=1;

 async function loadEpisodes(){
  $("episodeStatus").textContent="Chargement des épisodes...";
  try{
   const r=await fetch(`${JIKAN}/anime/${a.idMal}/episodes?page=${page}`);
   if(!r.ok)throw Error("HTTP "+r.status);
   const json=await r.json();
   if(token!==detailRequest)return;

   for(const ep of json.data||[]){
    const b=document.createElement("button");
    b.className="episode";
    b.textContent="Épisode "+ep.mal_id+" — "+(ep.title||"Sans titre");
    b.onclick=()=>{
     $("player").innerHTML='<p class="muted">Aucun lecteur vidéo complet disponible pour cet épisode.</p>';
     $("player").scrollIntoView({behavior:"smooth",block:"nearest"});
    };
    $("episodes").appendChild(b);
   }

   $("episodeStatus").textContent=$("episodes").children.length+" épisode(s) répertorié(s)";
   $("more").classList.toggle("hide",!json.pagination?.has_next_page);
  }catch(e){
   if(token===detailRequest)$("episodeStatus").textContent="Épisodes temporairement indisponibles : "+e.message;
  }
 }

 $("more").onclick=()=>{page++;loadEpisodes()};
 loadEpisodes();
}

$("search").addEventListener("input",e=>{
 clearTimeout(debounce);
 const value=e.target.value.trim();
 debounce=setTimeout(()=>{
  if(state.mode==="favorites"){
   state.mode="popular";
   ["popular","airing","favorites"].forEach(id=>$(id).classList.toggle("active",id==="popular"));
  }
  state.search=value;
  state.page=1;
  $("heading").textContent=value?"Résultats pour : "+value:"Animés populaires";
  load();
 },300);
});

$("genre").onchange=e=>{state.genre=e.target.value;state.page=1;load()};
$("sort").onchange=e=>{state.sort=e.target.value;state.page=1;load()};
$("prev").onclick=()=>{if(state.page>1){state.page--;load()}};
$("next").onclick=()=>{if(state.hasNext){state.page++;load()}};
$("popular").onclick=()=>setMode("popular");
$("airing").onclick=()=>setMode("airing");
$("favorites").onclick=()=>setMode("favorites");

function closeModal(){
 detailRequest++;
 $("overlay").classList.add("hide");
 document.body.style.overflow="";
 $("detail").innerHTML="";
}
$("close").onclick=closeModal;
$("overlay").onclick=e=>{if(e.target===$("overlay"))closeModal()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

load();
</script>
</body>
</html>
